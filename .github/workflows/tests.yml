name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # The expensive layer is the dependency install, and only pyproject.toml
      # invalidates it — so the buildx cache pays for itself on every run.
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          tags: teamtoken-mcp-dev
          load: true
          cache-from: type=gha,scope=mcp-dev
          cache-to: type=gha,mode=max,scope=mcp-dev

      # Sources arrive through the mount, so a code edit costs no rebuild — and
      # the tests run against exactly the interpreter the image ships.
      - name: pytest
        run: docker run --rm -v "$PWD":/work -w /work teamtoken-mcp-dev pytest -q
